# prj.conf — Zephyr RTOS Project Configuration
# Target  : ESP32-C3 Super Mini (esp32c3_devkitm)
# Project : CPR External AED Shock Controller
# Protocol: BLE PERIPHERAL ONLY (Manikin connects to AED; App only reads advertisements)

# ─── Serial Console & Logging ────────────────────────────────────────────────
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# ─── Kernel & Memory ─────────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_NEWLIB_LIBC=y

# ─── BLE Stack (Peripheral — Manikin connects to AED) ────────────────────────
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="AED_001"
CONFIG_BT_DEVICE_APPEARANCE=1792
CONFIG_BT_MAX_CONN=1
CONFIG_BT_SMP=y
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_BUF_ACL_RX_SIZE=256
CONFIG_BT_BUF_ACL_TX_SIZE=256
CONFIG_BT_L2CAP_TX_MTU=247

# ─── Peripheral Hardware Drivers ─────────────────────────────────────────────
CONFIG_GPIO=y
CONFIG_PWM=y
