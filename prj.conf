# prj.conf — Zephyr RTOS Project Configuration
# Target  : ESP32-C3 Super Mini (esp32c3_devkitm)
# Project : CPR External AED Shock Controller
# Protocol: ESP-NOW ONLY (No BLE)

# ─── Serial Console & Logging ───────────────────────────────────────────────
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# ─── Kernel & Memory ────────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_NEWLIB_LIBC=y

# ─── Wi-Fi (required to power RF hardware for ESP-NOW) ──────────────────────
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_NET_L2_WIFI_MGMT=y

# ─── Peripheral Hardware Drivers ────────────────────────────────────────────
CONFIG_GPIO=y
CONFIG_PWM=y
